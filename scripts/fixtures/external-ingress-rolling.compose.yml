name: ${ROLLING_SMOKE_PROJECT:?ROLLING_SMOKE_PROJECT is required}

x-hardening: &hardening
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend: &backend
  <<: *hardening
  image: ${IMAGE_PREFIX:-primalthrum}/server:${IMAGE_TAG:-1.0.0}
  command: ["node", "/fixtures/rolling-backend.mjs"]
  expose:
    - "3000"
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 1s
    timeout: 2s
    retries: 20
  volumes:
    - ./rolling-backend.mjs:/fixtures/rolling-backend.mjs:ro
  networks:
    - rolling

x-web: &web
  <<: *hardening
  image: ${IMAGE_PREFIX:-primalthrum}/web:${IMAGE_TAG:-1.0.0}
  environment:
    HOST: 0.0.0.0
    PORT: "8080"
    FORWARDED_PROTO: https
    PROXY_TIMEOUT_MS: "30000"
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 1s
    timeout: 2s
    retries: 20
  tmpfs:
    - /tmp:size=32m,mode=1777
  networks:
    - rolling

services:
  mock-old:
    <<: *backend
    environment:
      INSTANCE_NAME: old

  mock-new:
    <<: *backend
    environment:
      INSTANCE_NAME: new

  web-old:
    <<: *web
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      SERVER_PROXY_TARGET: http://mock-old:3000
      FORWARDED_PROTO: https
      PROXY_TIMEOUT_MS: "30000"
    depends_on:
      mock-old:
        condition: service_healthy

  web-new:
    <<: *web
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      SERVER_PROXY_TARGET: http://mock-new:3000
      FORWARDED_PROTO: https
      PROXY_TIMEOUT_MS: "30000"
    depends_on:
      mock-new:
        condition: service_healthy

  ingress:
    <<: *hardening
    image: nginx@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    user: "101:101"
    command: ["nginx", "-g", "daemon off;", "-c", "/config/nginx.conf"]
    depends_on:
      web-old:
        condition: service_healthy
      web-new:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ROLLING_SMOKE_PORT:-48443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--output-document=-", "https://127.0.0.1:8443/healthz"]
      interval: 1s
      timeout: 2s
      retries: 20
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ${ROLLING_SMOKE_CONFIG_DIR:?ROLLING_SMOKE_CONFIG_DIR is required}:/config:ro
      - ${ROLLING_SMOKE_CERT_DIR:?ROLLING_SMOKE_CERT_DIR is required}:/certs:ro
    networks:
      - rolling

networks:
  rolling:
