x-server-environment: &server-environment
  AGENT_BASE_URL: http://agent:8000
  DATABASE_URL: postgresql://primalthrum:primalthrum-development-secret@postgres:5432/primalthrum
  DATABASE_POOL_MAX: "20"
  DOCUMENT_STORAGE_PROVIDER: s3
  OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
  OBJECT_STORAGE_ACCESS_KEY_ID: primalthrum-development
  OBJECT_STORAGE_SECRET_ACCESS_KEY: primalthrum-development-secret
  OBJECT_STORAGE_BUCKET: primalthrum-documents
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_PREFIX: development

services:
  postgres:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: primalthrum
      POSTGRES_PASSWORD: primalthrum-development-secret
      POSTGRES_DB: primalthrum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primalthrum -d primalthrum"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: primalthrum-development
      MINIO_ROOT_PASSWORD: primalthrum-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data

  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - object-storage
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://object-storage:9000
      primalthrum-development primalthrum-development-secret; do sleep 1; done;
      mc mb --ignore-existing local/primalthrum-documents;
      mc version enable local/primalthrum-documents"

  agent:
    image: python:3.12-slim
    working_dir: /app/agent
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  server:
    image: node:22-alpine
    working_dir: /app/server
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      agent:
        condition: service_started
      object-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *server-environment
      BACKGROUND_WORKER_MODE: external
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app

  worker:
    image: node:22-alpine
    working_dir: /app/server
    command: sh -c "corepack enable && pnpm install && pnpm worker:dev"
    depends_on:
      agent:
        condition: service_started
      object-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *server-environment
      JOB_LEASE_DURATION_MS: "300000"
      JOB_POLL_INTERVAL_MS: "1000"
    volumes:
      - .:/app

  web:
    image: node:22-alpine
    working_dir: /app/web
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - server
    environment:
      VITE_SERVER_PROXY_TARGET: http://server:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/app

volumes:
  object-storage-data:
  postgres-data:
